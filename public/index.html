<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tent Function Music</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background -->
  <div id="bg-layer" class="bg-layer"></div>
  <div id="bg-overlay" class="bg-overlay"></div>

  <!-- Nuke check happens server-side, but just in case -->
  <div id="app">

    <!-- TOP BAR -->
    <header class="top-bar glass">
      <div class="online-badge">
        <span class="dot-live"></span>
        <span id="online-count">0</span> online
      </div>
      <div class="site-logo">
        <span id="site-name">🎵 Tent Function Music</span>
      </div>
      <div class="top-actions">
        <button class="btn-icon" id="theme-toggle" title="Toggle theme">☀️</button>
        <button class="btn-icon" id="menu-btn" title="Menu">☰</button>
      </div>
    </header>

    <!-- HAMBURGER MENU -->
    <div id="hamburger-overlay" class="menu-overlay hidden" onclick="closeMenu()"></div>
    <nav id="hamburger-menu" class="hamburger-menu glass hidden">
      <div class="menu-header">
        <span>Menu</span>
        <button class="btn-icon" onclick="closeMenu()">✕</button>
      </div>
      <ul id="menu-items" class="menu-list"></ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- HERO / SEARCH -->
      <section class="hero">
        <h1 class="hero-title">Find the Right Music</h1>
        <p class="hero-sub">For every function, every moment.</p>
        <div class="search-wrap glass">
          <span class="search-icon">🔎</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search songs, wedding, puja, birthday...">
          <button class="search-clear hidden" id="search-clear">✕</button>
        </div>
      </section>

      <!-- SEARCH RESULTS -->
      <section id="search-results" class="section hidden">
        <h2 class="section-title">Search Results</h2>
        <div id="search-results-content"></div>
      </section>

      <!-- CATEGORY QUICK BUTTONS -->
      <section id="cat-section" class="section">
        <div id="category-pills" class="pill-row"></div>
      </section>

      <!-- FEATURED PLAYLISTS -->
      <section id="featured-section" class="section">
        <h2 class="section-title">🔥 Popular Playlists</h2>
        <div id="featured-playlists" class="card-row"></div>
      </section>

      <!-- CATEGORIES LIST -->
      <section id="categories-section" class="section">
        <h2 class="section-title">Browse by Function</h2>
        <div id="categories-list" class="categories-grid"></div>
      </section>

    </main>

    <!-- PAGE VIEWS (injected dynamically) -->
    <div id="page-view" class="hidden"></div>

    <!-- MUSIC PLAYER (sticky bottom) -->
    <div id="player-bar" class="player-bar glass hidden">
      <div class="player-thumb">
        <img id="player-thumb-img" src="" alt="thumb" onerror="this.style.display='none'">
        <div class="player-info">
          <div id="player-title" class="player-title">—</div>
          <div id="player-artist" class="player-artist">—</div>
        </div>
      </div>
      <div class="player-controls">
        <button class="btn-icon" id="btn-prev">⏮</button>
        <button class="btn-play" id="btn-play">▶</button>
        <button class="btn-icon" id="btn-next">⏭</button>
      </div>
      <div class="player-right">
        <button class="btn-icon" id="btn-shuffle" title="Shuffle">🔀</button>
        <button class="btn-icon" id="btn-repeat" title="Repeat">🔁</button>
        <input type="range" id="vol-slider" class="vol-slider" min="0" max="100" value="80">
      </div>
      <!-- Progress bar -->
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <input type="range" class="progress-input" id="progress-input" min="0" max="100" value="0">
        </div>
      </div>
      <!-- YouTube embed hidden -->
      <div id="yt-container" class="yt-hidden"></div>
    </div>

  </div>

  <!-- SUGGEST MUSIC MODAL -->
  <div id="suggest-modal" class="modal-overlay hidden">
    <div class="modal glass">
      <div class="modal-header">
        <h3>💡 Suggest a Song</h3>
        <button class="btn-icon" onclick="closeSuggestModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Song Name *</label>
          <input type="text" id="sug-title" class="form-input" placeholder="e.g. Dilbaro">
        </div>
        <div class="form-group">
          <label>Artist</label>
          <input type="text" id="sug-artist" class="form-input" placeholder="e.g. Raazi">
        </div>
        <div class="form-group">
          <label>Function</label>
          <select id="sug-function" class="form-input">
            <option value="">Select function...</option>
          </select>
        </div>
        <div class="form-group">
          <label>YouTube / Spotify URL (optional)</label>
          <input type="url" id="sug-url" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Message (optional)</label>
          <textarea id="sug-message" class="form-input" rows="3" placeholder="Why should this be added?"></textarea>
        </div>
        <button class="btn-primary" onclick="submitSuggestion()">Submit Suggestion</button>
        <div id="sug-msg" class="form-msg"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/app.js"></script>
</body>
</html>
